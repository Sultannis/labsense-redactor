[project]
name = "labsense-redactor"
version = "0.1.0"
description = "Finds and removes personal details in digital lab report PDFs before an AI reads them"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "The LabSense authors" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.43",
    "en-core-web-md",
    "fastapi>=0.140",
    "pydantic>=2.13",
    "pymupdf>=1.28",
    "ru-core-news-md",
    "spacy>=3.8,<3.9",
    "uvicorn[standard]>=0.50",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Packages published in the last week aren't picked (supply-chain hygiene, as pnpm's
# minimum release age in labsense-backend).
exclude-newer = "2026-10-02T00:00:00Z"

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
ru-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/ru_core_news_md-3.8.0/ru_core_news_md-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.106",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "BLE", "SIM", "DTZ", "ISC", "S"]
# Cyrillic letters in strings and comments are intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "E501"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["labsense_redactor"]

[[tool.mypy.overrides]]
# PyMuPDF's partial annotations type most of its API as untyped; treat it as untyped.
module = ["pymupdf", "pymupdf.*", "spacy", "spacy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
